name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: moleculens_test
          POSTGRES_PASSWORD: isolated_test_password
          POSTGRES_DB: moleculens_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U moleculens_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://moleculens_test:isolated_test_password@127.0.0.1:5432/moleculens_test
      DATABASE_URL: postgresql://moleculens_test:isolated_test_password@127.0.0.1:5432/moleculens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest tests/unit -q
      - run: go vet ./... && go test -race ./...
      - name: Build pinned native candidate
        run: scripts/build_go_release.sh
      - name: Explicit migration and isolated services
        run: |
          build/moleculens-linux migrate
          mkdir -p var/ci-artifacts var/ci-legacy
          chmod 777 var/ci-artifacts
          engine_image_id=$(docker image inspect moleculens-go-worker:candidate --format '{{.Id}}')
          docker run -d --name qualified-worker --network host --memory 3g --cpus 2 --pids-limit 128 --init -e DATABASE_URL -e "ENGINE_BUILD=$engine_image_id" -v "$PWD/var/ci-artifacts:/var/go-artifacts" moleculens-go-worker:candidate
          docker run -d --name qualified-api --network host --memory 512m -e DATABASE_URL -v "$PWD/var/ci-artifacts:/var/go-artifacts:ro" -v "$PWD/var/ci-legacy:/var/legacy-artifacts:ro" moleculens-go-api:candidate
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Native HTTP and independent xTB checks
        run: |
          uv run pytest tests/integration/test_legacy_postgres.py -q
          python3 scripts/qualify_go_service.py --url http://127.0.0.1:8000 --output build/native-http.json
          docker run --rm --memory 3g --cpus 2 -v "$PWD/scripts:/scripts:ro" --entrypoint /opt/conda/bin/python moleculens-engine:qualified /scripts/qualify_native_xtb.py > build/xtb-translation.json
          uv run python scripts/qualify_crash_recovery.py --url http://127.0.0.1:8000 --docker-context default --worker qualified-worker --output build/crash-recovery.json
          uv run python -m moleculens.compute.nomenclature_benchmark benchmarks/nomenclature_corpus.json --verify-opsin --enforce --output build/naming-opsin.json
      - name: Capture logs and stop isolated services
        if: always()
        run: |
          mkdir -p build
          docker logs qualified-worker > build/worker.log 2>&1 || true
          docker logs qualified-api > build/api.log 2>&1 || true
          docker rm -f qualified-worker qualified-api || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-receipts
          path: |
            build/*.json
            build/*.log
