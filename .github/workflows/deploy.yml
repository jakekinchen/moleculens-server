# Production cutover is deliberately separate from merge/build. The prior
# push-to-main SSH job bypassed host-key verification and ran unfenced legacy
# deployment. It cannot safely perform this schema/process ownership migration.
name: Prepare Go Release
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: scripts/build_go_release.sh
      - name: Export immutable local images for reviewed deployment
        run: docker save moleculens-go-api:candidate moleculens-go-worker:candidate | gzip > build/moleculens-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: moleculens-go-release
          path: |
            build/release.json
            build/moleculens-images.tar.gz
            compose.go.yml
            docs/go-release-runbook.md
